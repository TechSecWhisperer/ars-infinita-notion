name: Delivery freshness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery-gate:
    name: Delivery freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # REQUIRED — the gate reads history
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/delivery_gate.mjs
