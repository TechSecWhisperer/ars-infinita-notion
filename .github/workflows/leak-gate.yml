name: Leak Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  leak-check:
    name: Sealed-mechanics leak check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # needed to diff this branch's commits against base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run leak_check.py
        run: python3 tools/leak_check.py

      # A pull request title and body are as public as any committed file, and
      # a file scanner cannot see either. Passed through the environment rather
      # than interpolated into the script: the body is attacker-controlled text
      # on a public repository, and `${{ }}` inside a run block would make it
      # executable.
      - name: Scan the pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | python3 tools/leak_check.py --text "the pull request title/body"

      # Only the commits this branch ADDS. Scanning full history would fail
      # permanently on text that is already published and cannot be rewritten,
      # and a required check that can never go green teaches people to bypass
      # it — which costs more than the hole it was closing.
      - name: Scan new commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git log --format=%B "origin/$BASE_REF..HEAD" \
            | python3 tools/leak_check.py --text "this branch's commit messages"
  delivery-gate:
    name: Delivery freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # REQUIRED — the gate reads history
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tools/delivery_gate.mjs

  # Runs the structural check battery at review time. The same battery also
  # runs at release, via prepublishOnly; running it here surfaces problems
  # while they are cheap to fix rather than when a publish is blocked.
  #
  # gate_audit.mjs is deliberately NOT here. It rebuilds the tree once per
  # mutation and is slow; it belongs at publish, and before any change to the
  # checks themselves.
  structural-gate:
    name: Structural gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The battery hard-fails on an unbuilt dist/ rather than reporting
      # success without running, so this build step is load-bearing.
      - run: node builder.mjs
        working-directory: packages/system-skills
      - run: node test/checks.mjs
        working-directory: packages/system-skills

      # builder.mjs regenerates the committed generated files, so the steps
      # above can end up comparing a freshly-regenerated file against itself.
      # This asserts the tree is unchanged by the build: if anything moved, the
      # generated files on the branch are not what the sources produce, and
      # they need rebuilding and committing.
      #
      # dist/ is gitignored, so this sees only tracked generated files.
      - run: git diff --exit-code
