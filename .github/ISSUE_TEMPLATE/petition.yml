name: Petition the Game Admin
description: A question, enhancement idea, bug report, or mercy appeal for whoever runs The System. This is what /petition files for you.
title: "[Petition] "
labels: ["petition"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Anyone can read it, and it stays readable after it is closed.

        Keep job-search specifics out of it — employers, roles, salaries, contacts, and document
        contents belong in your own Notion workspace, not here. Your agent will say the same thing
        before it files on your behalf.

        Answers are **best-effort**. This is a game run by one person, not a support desk.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Question
        - Enhancement
        - Bug
        - Mercy appeal
        - Other
    validations:
      required: true

  - type: input
    id: handle
    attributes:
      label: Handle
      description: Your in-game handle from your Kernel. Not your real name.
      placeholder: e.g. The Architect
    validations:
      required: false

  - type: input
    id: seed_version
    attributes:
      label: Seed version
      description: The Seed template version from your Kernel's Versions section.
      placeholder: e.g. Seed v1.0.0
    validations:
      required: false

  - type: input
    id: mechanics_version
    attributes:
      label: Mechanics version
      description: Also in your Kernel — a different number from the Seed version.
      placeholder: e.g. 1.3.1
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        The substance of your petition, in your own words. Describe what you want, saw, or expected.
      placeholder: What happened, or what would you like changed?
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you file
      options:
        - label: I understand this issue is public and have kept personal and job-search details out of it.
          required: true
